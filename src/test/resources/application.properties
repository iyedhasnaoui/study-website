spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.docker.compose.enabled=false
app.upload.forum-directory=${java.io.tmpdir}/study-website-tests/forum
app.upload.material-directory=${java.io.tmpdir}/study-website-tests/materials
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/iac
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:1/test-keys
app.keycloak.base-url=http://127.0.0.1:1
app.keycloak.realm=iac-test
app.keycloak.admin-client-id=iac-backend-test
app.keycloak.admin-client-secret=unused-test-secret
