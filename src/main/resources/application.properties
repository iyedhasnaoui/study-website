spring.application.name=study-website

spring.datasource.url=jdbc:postgresql://localhost:5432/studydb
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.skip.in-tests=false

logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.apache.coyote.http11=DEBUG


spring.sql.init.mode=always

spring.jpa.defer-datasource-initialization=true

# Keycloak is the source of truth for identity and roles.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/iac}

app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}
app.keycloak.realm=${KEYCLOAK_REALM:iac}
app.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:iac-backend}
app.keycloak.admin-client-secret=${IAC_BACKEND_SECRET:backend-dev-secret}
app.upload.forum-directory=uploads/forum
app.upload.material-directory=uploads/materials
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB


