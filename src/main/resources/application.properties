spring.application.name=study-website

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local dev starts docker-compose.yml automatically. Set SPRING_DOCKER_COMPOSE_ENABLED=false when deployed
# (otherwise Spring's compose support overrides the datasource URL above).
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.skip.in-tests=false

logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.apache.coyote.http11=DEBUG


spring.sql.init.mode=always

spring.jpa.defer-datasource-initialization=true

# Keycloak is the source of truth for identity and roles.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/iac}

app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}
app.keycloak.realm=${KEYCLOAK_REALM:iac}
app.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:iac-backend}
app.keycloak.admin-client-secret=${IAC_BACKEND_SECRET:backend-dev-secret}
app.upload.forum-directory=${APP_UPLOAD_FORUM_DIRECTORY:uploads/forum}
app.upload.material-directory=${APP_UPLOAD_MATERIAL_DIRECTORY:uploads/materials}

# Comma-separated list of browser origins allowed to call the API (no trailing slashes).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB


